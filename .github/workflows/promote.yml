# Promoção para produção (REQ-FND-024): reutiliza o MESMO release.json (mesmos digests) que está
# saudável em staging, sem rebuild. O environment `production` exige revisores obrigatórios.
name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão (AAAA.MM.DD-sha7) já em staging
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment:
      name: production
      url: https://koovela.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: baixar o release.json da versão
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$'
          gh release download "${{ inputs.version }}" --pattern release.json
      - name: confirmar que a versão está saudável em staging
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          status=$(gh api "repos/${{ github.repository }}/deployments?environment=staging&per_page=20" \
            --jq '[.[] | select(.payload.version == "${{ inputs.version }}" or .ref == "'"$(jq -r .commit release.json)"'")][0].statuses_url' \
            | xargs -r gh api --jq '.[0].state')
          [ "$status" = success ] || { echo "versão não está saudável em staging (estado: ${status:-nenhum})"; exit 1; }
      - name: promover (approved_by = quem aprovou o environment)
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          approver=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" --jq '.[0].user.login')
          [ -n "$approver" ] || { echo "sem aprovação registrada"; exit 1; }
          sh infra/host/koovela-deploy/remote.sh production release.json promotion "$approver"
