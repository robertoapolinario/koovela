version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      all-npm: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /infra/compose
    schedule: { interval: weekly }
    groups:
      all-docker: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      all-actions: { patterns: ["*"] }
