# Varredura do histórico inteiro (REQ-FND-082): toda semana e a cada push na main.
name: secrets-history
on:
  push: { branches: [main] }
  schedule: [{ cron: '23 5 * * 1' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: sh tools/dev/secrets-scan.sh --history
