#cloud-config
# Host app-host (Ubuntu 24.04 ARM64). Sem porta de entrada: acesso administrativo só por cloudflared (Access + MFA).
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, gnupg, jq, git, unattended-upgrades, python3-venv]
users:
  - default
  - name: koovela
    groups: [docker]
    shell: /bin/bash
    sudo: ['ALL=(root) NOPASSWD: /usr/local/bin/koovela-deploy']
write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/ssh/sshd_config.d/10-koovela.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      ListenAddress 127.0.0.1
runcmd:
  # Docker Engine + Compose v2 (repositório oficial)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  # cosign (verificação de assinatura das imagens)
  - curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v3.1.6/cosign-linux-arm64
  - echo "bbb2ebc765f483cf9fac42da8763dddc2b55b350ee12ea0c44a520a6d6d52334  /usr/local/bin/cosign" | sha256sum -c - && chmod 0755 /usr/local/bin/cosign
  # OCI CLI (leitura dos segredos com instance principal)
  - python3 -m venv /opt/oci-cli && /opt/oci-cli/bin/pip install --quiet oci-cli && ln -sf /opt/oci-cli/bin/oci /usr/local/bin/oci
  # código de operação do repositório público (compose, scripts, systemd)
  - git clone --depth 1 https://github.com/robertoapolinario/koovela.git /opt/koovela
  - install -m 0755 /opt/koovela/infra/host/koovela-deploy/koovela-deploy /usr/local/bin/koovela-deploy
  - install -m 0755 /opt/koovela/infra/host/koovela-deploy/secrets.sh /usr/local/bin/koovela-sync-secrets
  - install -d -m 0750 -o root -g docker /etc/koovela
  - install -d -m 0750 -o koovela -g koovela /var/lib/koovela /var/lib/koovela/metrics
  - cp /opt/koovela/infra/host/systemd/*.service /opt/koovela/infra/host/systemd/*.timer /etc/systemd/system/
  - systemctl daemon-reload
  - systemctl enable --now docker koovela-secrets.timer
  - /usr/local/bin/koovela-sync-secrets && systemctl enable --now koovela-tunnel.service
  - systemctl enable koovela-app.service
