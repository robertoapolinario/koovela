groups:
  - name: hosts
    rules:
      - alert: DiskAbove80
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.8
        for: 10m
        labels: { severity: critical, environment: '{{ $externalLabels.environment }}' }
        annotations:
          summary: 'disco {{ $labels.mountpoint }} acima de 80% em {{ $labels.host }}'
          runbook: docs/ops/runbooks/alertas/disk-above-80.md
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 3m
        labels: { severity: critical, environment: '{{ $externalLabels.environment }}' }
        annotations:
          summary: 'host {{ $labels.host }} sem métricas há 3 min'
          runbook: docs/ops/runbooks/alertas/host-down.md
