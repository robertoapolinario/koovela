openapi: 3.1.0
info:
  title: Koovela Scheduling — disponibilidade e ocupações
  version: 1.0.0
  description: >
    Spec 008. Consulta de horários (consumidor e equipe) e comandos internos de ocupação, usados pela
    spec 009 e pelas demais origens (013, 014, 026, 030, 034, 035). Consulta nunca é garantia (CONST I).
servers:
  - url: https://api.koovela.com
  - url: http://core.internal:8080
    description: /v1/internal/scheduling/occupancies
paths:
  /v1/public/businesses/{slug}/availability:
    get:
      operationId: getConsumerAvailability
      x-koovela-action: public.availability.read
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/BranchId' }
        - { $ref: '#/components/parameters/ItemKind' }
        - { $ref: '#/components/parameters/ItemId' }
        - { name: professional_id, in: query, schema: { type: string, format: uuid }, description: Ausente = qualquer profissional }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 14, default: 7 } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
          description: Inícios livres (com antecedência e horizonte do consumidor)
  /v1/tenant/availability:
    get:
      operationId: getStaffAvailability
      x-koovela-action: scheduling.availability.staff_read
      parameters:
        - { $ref: '#/components/parameters/BranchId' }
        - { $ref: '#/components/parameters/ItemKind' }
        - { $ref: '#/components/parameters/ItemId' }
        - { name: professional_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
        - { name: include_outside_hours, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
          description: Sem antecedência mínima; inclui serviços internos
  /v1/internal/scheduling/occupancies/holds:
    post:
      operationId: createHold
      x-koovela-action: internal.scheduling.occupancy.write
      parameters: [ { name: Idempotency-Key, in: header, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Occupancy' }
          description: Reserva temporária de 10 min (combo = todas as etapas)
        '409':
          description: scheduling.slot_taken (com alternativas), scheduling.hold_limit_reached, scheduling.outside_work_hours, scheduling.time_off_conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/SlotTakenProblem' }
  /v1/internal/scheduling/occupancies/{occupancy_id}/extend:
    post:
      operationId: extendHold
      x-koovela-action: internal.scheduling.occupancy.write
      parameters: [ { $ref: '#/components/parameters/OccupancyId' } ]
      responses:
        '200': { description: Estendida (uma vez, até 30 min no total) }
        '409': { description: scheduling.hold_extension_not_allowed }
  /v1/internal/scheduling/occupancies/{occupancy_id}/confirm:
    post:
      operationId: confirmOccupancy
      x-koovela-action: internal.scheduling.occupancy.write
      parameters: [ { $ref: '#/components/parameters/OccupancyId' }, { name: Idempotency-Key, in: header, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [appointment_id]
              properties:
                appointment_id: { type: string, format: uuid }
      responses:
        '200': { description: hold → definitive sem janela livre no meio }
        '410': { description: scheduling.hold_expired }
  /v1/internal/scheduling/occupancies:
    post:
      operationId: createDefinitive
      x-koovela-action: internal.scheduling.occupancy.write
      summary: Ocupação definitiva direta (equipe, série, fila, horário ocioso), com o mesmo lock + constraint
      parameters: [ { name: Idempotency-Key, in: header, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/HoldRequest'
                - type: object
                  required: [appointment_id]
                  properties:
                    appointment_id: { type: string, format: uuid }
                    override: { type: object, properties: { reason: { type: string, minLength: 5 } }, description: Fora da escala ou do horário da filial (só equipe) }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Occupancy' }
          description: Ocupada
        '409':
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/SlotTakenProblem' }
          description: Conflito
    get:
      operationId: listOccupancies
      x-koovela-action: internal.scheduling.occupancy.read
      parameters:
        - { name: professional_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Ocupações no período (para agendas e listas de afetados) }
  /v1/internal/scheduling/occupancies/{occupancy_id}/release:
    post:
      operationId: releaseOccupancy
      x-koovela-action: internal.scheduling.occupancy.write
      parameters: [ { $ref: '#/components/parameters/OccupancyId' }, { name: Idempotency-Key, in: header, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [cancelled, rescheduled, hold_abandoned, no_show_released] }
      responses:
        '200': { description: Janela liberada (todas as etapas, se combo) }
components:
  parameters:
    BranchId: { name: branch_id, in: query, required: true, schema: { type: string, format: uuid } }
    ItemKind: { name: item_kind, in: query, required: true, schema: { type: string, enum: [service, combo] } }
    ItemId: { name: item_id, in: query, required: true, schema: { type: string, format: uuid } }
    OccupancyId: { name: occupancy_id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Availability:
      type: object
      required: [timezone, days]
      properties:
        timezone: { type: string, description: Fuso da filial }
        grid_min: { type: integer }
        next_available_date: { type: [string, 'null'], format: date }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              starts:
                type: array
                items:
                  type: object
                  required: [start, professional_ids]
                  properties:
                    start: { type: string, format: date-time }
                    professional_ids: { type: array, items: { type: string, format: uuid } }
                    outside_hours: { type: boolean, description: Só na visão da equipe com include_outside_hours }
    HoldRequest:
      type: object
      required: [branch_id, item_kind, item_id, start, origin]
      properties:
        branch_id: { type: string, format: uuid }
        item_kind: { type: string, enum: [service, combo] }
        item_id: { type: string, format: uuid }
        service_version_id: { type: string, format: uuid }
        professional_id: { type: [string, 'null'], format: uuid, description: Nulo = atribuir pelo menos ocupado do dia }
        start: { type: string, format: date-time }
        origin: { type: string, enum: [consumer_app, consumer_web, staff_panel, pro_app, series, waitlist, idle_offer, class, combo_swap, lesson, event_hold, discovery, campaign] }
        consumer_id: { type: [string, 'null'], format: uuid }
        subject_id: { type: [string, 'null'], format: uuid, description: 'Atendido da 025; para pet, a duração vem da regra por porte e pelagem (versão congelada em duration_rule_version_id)' }
    Occupancy:
      type: object
      required: [occupancy_id, kind, professional_id, shown_start, shown_end]
      properties:
        occupancy_id: { type: string, format: uuid }
        kind: { type: string, enum: [hold, definitive] }
        professional_id: { type: string, format: uuid }
        shown_start: { type: string, format: date-time }
        shown_end: { type: string, format: date-time }
        protected_start: { type: string, format: date-time }
        protected_end: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        steps:
          type: array
          items:
            type: object
            properties:
              step_index: { type: integer }
              occupancy_id: { type: string, format: uuid }
              shown_start: { type: string, format: date-time }
              shown_end: { type: string, format: date-time }
    SlotTakenProblem:
      allOf:
        - $ref: '../../001-fundacao-plataforma/contracts/problem-details.schema.json'
        - type: object
          properties:
            alternatives:
              type: array
              maxItems: 4
              items:
                type: object
                properties:
                  start: { type: string, format: date-time }
                  professional_id: { type: string, format: uuid }
                  kind: { type: string, enum: [nearest_same_professional, same_time_other_professional] }
