# Entrega (REQ-FND-014/020/021/022): merge na main → imagens linux/arm64 assinadas no GHCR,
# SBOM, release.json no GitHub Release e deploy por pull no staging.
name: deliver

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deliver-main
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (OIDC)
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: gateway, dockerfile: services/gateway/Dockerfile }
          - { name: core, dockerfile: runtimes/core/Dockerfile }
          - { name: workers, dockerfile: runtimes/workers/Dockerfile }
          - { name: consumer-web, dockerfile: apps/consumer-web/Dockerfile }
          - { name: tenant-web, dockerfile: apps/tenant-web/Dockerfile }
          - { name: admin-web, dockerfile: apps/admin-web/Dockerfile }
          - { name: bi-placeholder, dockerfile: apps/bi-placeholder/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Trivy (imagem publicada)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image.name }}.cdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: cosign (keyless) — assinatura e atestado do SBOM
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.image.name }}.cdx.json" "${IMAGE}@${{ steps.build.outputs.digest }}"
      - run: |
          mkdir -p out
          echo "${{ steps.build.outputs.digest }}" > "out/${{ matrix.image.name }}.digest"
          mv "sbom-${{ matrix.image.name }}.cdx.json" out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image.name }}
          path: out/
          retention-days: 7

  release:
    needs: [meta, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: image-*, path: images, merge-multiple: true }
      - name: release.json
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          node tools/release/assemble.ts images release.json
          (cd images && zip -q ../sbom.cdx.zip ./*.cdx.json)
          echo '{"event_type":"platform.release.built.v1","version":"${{ needs.meta.outputs.version }}"}'
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            release.json
            sbom.cdx.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release, path: release.json }

  deploy-staging:
    needs: [meta, release]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.koovela.com
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release }
      - name: deploy por pull no app-stg-01 (via Cloudflare Access + túnel)
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: sh infra/host/koovela-deploy/remote.sh staging release.json deploy
